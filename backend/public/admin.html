<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<title>Zakhrafa Admin Panel</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Jost', Arial, sans-serif; background: #FAF8F5; color: #262220; margin: 0; padding: 30px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-weight: 600; }
  .card { background: #fff; border: 1px solid #ECE7E1; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #ECE7E1; border-radius: 6px; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
  button { background: #262220; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13.5px; }
  button.secondary { background: none; color: #262220; border: 1px solid #ECE7E1; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ECE7E1; }
  .row { display: flex; gap: 10px; align-items: center; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #FAF8F5; border: 1px solid #ECE7E1; }
  #login-screen { max-width: 360px; margin: 80px auto; }
  .hidden { display: none; }
  .error { color: #B4552F; font-size: 13px; }
</style>
</head>
<body>

<div id="login-screen" class="card">
  <h2>Admin Login</h2>
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Log In</button>
  <div id="login-error" class="error"></div>
</div>

<div id="dashboard" class="wrap hidden">
  <div class="row" style="justify-content: space-between;">
    <h1>Zakhrafa Admin Panel</h1>
    <button class="secondary" onclick="logout()">Log Out</button>
  </div>

  <div class="card">
    <h3>Add New Product</h3>
    <div class="row">
      <input id="p-name" placeholder="Product name" />
      <select id="p-cat">
        <option value="mosaic">Mosaic Mirrors</option>
        <option value="pharaonic">Pharaonic Art</option>
        <option value="ramadan">Occasion Decor</option>
        <option value="oriental">Oriental Panels</option>
      </select>
    </div>
    <div class="row">
      <input id="p-price" type="number" placeholder="Price" />
      <input id="p-stock" type="number" placeholder="Stock quantity" />
    </div>
    <input id="p-img" placeholder="Product image URL (e.g. /images/products/name.jpg)" />
    <textarea id="p-desc" placeholder="Short product description"></textarea>
    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h3>Products</h3>
    <table id="products-table">
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Orders</h3>
    <table id="orders-table">
      <thead><tr><th>#</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Contact Messages</h3>
    <table id="messages-table">
      <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API = ""; // same origin
let token = localStorage.getItem("zakhrafa_admin_token");

const catLabels = { mosaic: "Mosaic Mirrors", pharaonic: "Pharaonic Art", ramadan: "Occasion Decor", oriental: "Oriental Panels" };

if (token) showDashboard();

async function login() {
  const password = document.getElementById("password").value;
  const res = await fetch(`${API}/api/admin/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password }),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById("login-error").innerText = data.error;
    return;
  }
  token = data.token;
  localStorage.setItem("zakhrafa_admin_token", token);
  showDashboard();
}

function logout() {
  localStorage.removeItem("zakhrafa_admin_token");
  location.reload();
}

function showDashboard() {
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadProducts();
  loadOrders();
  loadMessages();
}

async function loadProducts() {
  const res = await fetch(`${API}/api/products`);
  const products = await res.json();
  const tbody = document.querySelector("#products-table tbody");
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>${p.name}</td>
      <td><span class="tag">${catLabels[p.cat] || p.cat}</span></td>
      <td>EGP ${p.price}</td>
      <td>${p.stock ?? "-"}</td>
      <td><button class="secondary" onclick="deleteProduct(${p.id})">Delete</button></td>
    </tr>
  `).join("");
}

async function addProduct() {
  const body = {
    name: document.getElementById("p-name").value,
    cat: document.getElementById("p-cat").value,
    price: document.getElementById("p-price").value,
    stock: document.getElementById("p-stock").value,
    img: document.getElementById("p-img").value,
    description: document.getElementById("p-desc").value,
  };
  const res = await fetch(`${API}/api/products`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    document.getElementById("p-name").value = "";
    document.getElementById("p-price").value = "";
    document.getElementById("p-stock").value = "";
    document.getElementById("p-img").value = "";
    document.getElementById("p-desc").value = "";
    loadProducts();
  } else {
    alert((await res.json()).error);
  }
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;
  await fetch(`${API}/api/products/${id}`, {
    method: "DELETE",
    headers: { Authorization: `Bearer ${token}` },
  });
  loadProducts();
}

async function loadOrders() {
  const res = await fetch(`${API}/api/orders`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) return;
  const orders = await res.json();
  const tbody = document.querySelector("#orders-table tbody");
  tbody.innerHTML = orders.slice().reverse().map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>${o.customer.name}</td>
      <td>${o.customer.phone}</td>
      <td>EGP ${o.total}</td>
      <td><span class="tag">${o.status}</span></td>
    </tr>
  `).join("") || "<tr><td colspan='5'>No orders yet</td></tr>";
}

async function loadMessages() {
  const res = await fetch(`${API}/api/contact`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) return;
  const messages = await res.json();
  const tbody = document.querySelector("#messages-table tbody");
  tbody.innerHTML = messages.slice().reverse().map(m => `
    <tr>
      <td>${m.name}</td>
      <td>${m.email}</td>
      <td>${m.subject || "-"}</td>
      <td style="max-width:280px;">${m.message}</td>
      <td><button class="secondary" onclick="deleteMessage(${m.id})">Delete</button></td>
    </tr>
  `).join("") || "<tr><td colspan='5'>No messages yet</td></tr>";
}

async function deleteMessage(id) {
  if (!confirm("Delete this message?")) return;
  await fetch(`${API}/api/contact/${id}`, {
    method: "DELETE",
    headers: { Authorization: `Bearer ${token}` },
  });
  loadMessages();
}
</script>
</body>
</html>
